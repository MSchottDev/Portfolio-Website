<main class="contact-section">

    <section class="contact-card glass">

        <h1 class="contact-title">
            Kontakt
        </h1>

        <p class="contact-intro">
            Sie haben eine Frage oder möchten mit mir in Kontakt treten?
            Schreiben Sie mir gerne eine Nachricht.
        </p>


        <form class="contact-form" id = "contactForm">

            <div class="form-group">
                <label for="name">
                    Name
                </label>

                <input 
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Ihr Name">
            </div>


            <div class="form-group">
                <label for="email">
                    E-Mail
                </label>

                <input 
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Ihre E-Mail-Adresse">
            </div>


            <div class="form-group">
                <label for="message">
                    Nachricht
                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    placeholder="Ihre Nachricht">
                </textarea>
            </div>


            <button class="contact-button" type="submit">
                Senden
            </button>

        </form>


        <div class="contact-success">
            
        </div>


    </section>

</main>
